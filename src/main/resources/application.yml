spring:
  application:
    name: portfolioBackend

  data:
    mongodb:
      uri: "mongodb+srv://Abhay:Abhay@abhaypersonaldb.qs3zbni.mongodb.net/AnuragKashyap?appName=AbhayPersonalDB"

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    oauth2:
      client:
        registration:
          google:
            scope: openid,email,profile
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
        provider:
          google:
            user-name-attribute: sub

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-local-yml}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  oauth2:
    frontend-redirect-url: ${OAUTH2_FRONTEND_REDIRECT_URL:http://localhost:3000/auth/callback}

