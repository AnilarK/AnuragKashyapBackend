# Production profile — secrets only via environment variables
spring:
  config:
    activate:
      on-profile: prod

  application:
    name: portfolioBackend

  mongodb:
    uri: ${MONGODB_URI}

  # Render (and many clouds) block outbound SMTP to Gmail — use SendGrid SMTP instead.
  mail:
    host: ${MAIL_HOST:smtp.sendgrid.net}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: ${MAIL_SSL_TRUST:smtp.sendgrid.net}
          connectiontimeout: 15000
          timeout: 15000
          writetimeout: 15000

  security:
    oauth2:
      client:
        registration:
          google:
            scope: openid,email,profile
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
        provider:
          google:
            user-name-attribute: sub

server:
  # Render provides PORT; keep SERVER_PORT override if you set it
  port: ${SERVER_PORT:${PORT:8080}}
  servlet:
    context-path: ${CONTEXT_PATH:/}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:info}
    com.portfolioBackend: ${LOG_LEVEL_APP:info}

app:
  mail:
    from: ${MAIL_FROM:}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  oauth2:
    frontend-redirect-url: ${OAUTH2_FRONTEND_REDIRECT_URL:https://your-frontend.example.com/auth/callback}
