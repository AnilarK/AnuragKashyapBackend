# Example local config – copy to application-local.yml and fill in your secrets
# application-local.yml is gitignored and must not be committed

spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/portfolio
      # Or Atlas: mongodb+srv://USER:PASSWORD@cluster.mongodb.net/portfolio
  mail:
    username: your-sender@gmail.com
    password: your-gmail-app-password
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: xxx.apps.googleusercontent.com
            client-secret: GOCSPX-xxx

server:
  port: 8080

app:
  jwt:
    # Generate: openssl rand -base64 32
    secret: paste-32-or-more-char-secret-here
    expiration-ms: 86400000
  oauth2:
    frontend-redirect-url: http://localhost:3000/auth/callback
